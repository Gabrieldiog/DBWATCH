name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: dbwatch_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-somente-teste@127.0.0.1:5433/dbwatch_test
      MIGRATOR_DATABASE_URL: postgres://dbwatch_migrator:ci-migrator@127.0.0.1:5433/dbwatch_test
      DBWATCH_MIGRATOR_PASSWORD: ci-migrator
      DBWATCH_APP_PASSWORD: ci-app
      DBWATCH_MONITOR_PASSWORD: ci-monitor
      DBWATCH_LAB_PASSWORD: ci-lab
      DBWATCH_TARGET_RO_PASSWORD: ci-target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cria os papéis do banco (mesmo script do Compose)
        run: sh infra/postgres/init/01-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGPASSWORD: ci-somente-teste
          POSTGRES_DB: dbwatch_test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
